name: Pullman Khao Lak price check

on:
  workflow_dispatch:

  schedule:
    # 00:15 UTC is 08:15 Perth time.
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ACCOR_URL: ${{ vars.ACCOR_URL }}
      TARGET_PRICE: ${{ vars.TARGET_PRICE }}
      CURRENCY: ${{ vars.CURRENCY }}
      EMAIL_MODE: ${{ vars.EMAIL_MODE }}

      EMAIL_TO: benleadbeatter2@hotmail.com
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      SMTP_HOST: smtp-mail.outlook.com
      SMTP_PORT: "587"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Restore previous price
        uses: actions/cache@v4
        with:
          path: previous-price.json
          key: pullman-khao-lak-price-${{ github.run_id }}
          restore-keys: |
            pullman-khao-lak-price-

      - name: Check the Accor price
        run: python tracker.py

      - name: Upload price results and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pullman-khao-lak-${{ github.run_number }}
          path: |
            accor-price-check.png
            price-result.json
            previous-price.json
          if-no-files-found: ignore
          retention-days: 30
