name: Pullman Khao Lak price check

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions uses UTC.
    # 00:15 UTC is 08:15 Perth time.
    - cron: "15 0 * * *"

permissions:
  contents: read

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Use the complete Accor booking URL containing
      # your dates and number of guests.
      ACCOR_URL: ${{ vars.ACCOR_URL || 'https://all.accor.com/hotel/B436/index.en.shtml' }}

      # Price range and currency.
      CURRENCY: ${{ vars.CURRENCY || 'THB' }}
      MIN_PRICE: ${{ vars.MIN_PRICE || '1300' }}
      MAX_PRICE: ${{ vars.MAX_PRICE || '1400' }}

      # Recipient.
      EMAIL_TO: benleadbeatter2@hotmail.com

      # Secure sender credentials.
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      # Microsoft Outlook/Hotmail email server.
      SMTP_HOST: smtp-mail.outlook.com
      SMTP_PORT: "587"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Check Accor price
        run: python tracker.py

      - name: Upload screenshot and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pullman-khao-lak-${{ github.run_number }}
          path: |
            accor-price-check.png
            price-result.json
          if-no-files-found: ignore
          retention-days: 30
